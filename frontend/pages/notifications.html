<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="notifications.html" class="active">Thông báo</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                <h2 style="font-size:18px;font-weight:600;">Thông báo</h2>
                <button onclick="loadNotifications()" class="btn btn-outline btn-sm">Làm mới</button>
            </div>

            <div id="notificationList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadNotifications() {
            try {
                // 1. Hợp đồng sắp hết hạn
                const expiredSoonRes = await fetch('http://localhost:5000/api/notifications/expired-soon', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const expiredSoonData = await expiredSoonRes.json();

                // 2. Hợp đồng đã hết hạn
                const expiredRes = await fetch('http://localhost:5000/api/notifications/expired', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const expiredData = await expiredRes.json();

                let html = '';

                // Hợp đồng sắp hết hạn
                if (expiredSoonData.success && expiredSoonData.notifications.length > 0) {
                    html += `
                        <div class="card">
                            <div class="card-header">Sắp hết hạn (${expiredSoonData.notifications.length})</div>
                    `;
                    expiredSoonData.notifications.forEach(n => {
                        html += `
                            <div style="padding:8px 0;border-bottom:1px solid var(--border-color);">
                                <p><strong>Hợp đồng #${n.ma_hop_dong.slice(0, 8)}</strong></p>
                                <p style="font-size:13px;color:var(--text-secondary);">
                                    Còn ${n.con_lai} giờ - Kết thúc: ${new Date(n.thoi_gian_ket_thuc).toLocaleString('vi-VN')}
                                </p>
                                <a href="rental-detail-view.html?id=${n.ma_hop_dong}" class="btn btn-outline btn-sm">Xem</a>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                // Hợp đồng đã hết hạn
                if (expiredData.success && expiredData.expired.length > 0) {
                    html += `
                        <div class="card">
                            <div class="card-header">Đã hết hạn (${expiredData.expired.length})</div>
                    `;
                    expiredData.expired.forEach(n => {
                        html += `
                            <div style="padding:8px 0;border-bottom:1px solid var(--border-color);">
                                <p><strong>Hợp đồng #${n.ma_hop_dong.slice(0, 8)}</strong></p>
                                <p style="font-size:13px;color:var(--danger);">
                                    Đã hết hạn từ ${new Date(n.thoi_gian_ket_thuc).toLocaleString('vi-VN')}
                                </p>
                                <button onclick="alert('Vui lòng trả NFT ngay!')" class="btn btn-danger btn-sm">Trả ngay</button>
                                <a href="rental-detail-view.html?id=${n.ma_hop_dong}" class="btn btn-outline btn-sm">Xem</a>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (!html) {
                    html = `
                        <div class="card">
                            <div class="card-header">Thông báo</div>
                            <p style="color:var(--text-muted);text-align:center;padding:20px 0;">Không có thông báo mới</p>
                        </div>
                    `;
                }

                document.getElementById('notificationList').innerHTML = html;

            } catch (error) {
                document.getElementById('notificationList').innerHTML = `<div class="msg msg-error">Lỗi tải thông báo</div>`;
            }
        }

        loadWalletBalance();
        loadNotifications();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
