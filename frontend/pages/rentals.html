<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hợp đồng thuê</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html" class="active">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                <h2 style="font-size:18px;font-weight:600;">Hợp đồng thuê</h2>
                <a href="marketplace.html" class="btn btn-primary btn-sm">Thuê thêm</a>
            </div>

            <!-- Loading -->
            <div id="loading" style="text-align:center;padding:30px 0;color:var(--text-muted);">Đang tải...</div>

            <!-- Nội dung -->
            <div id="rentalList" style="display:none;"></div>

            <!-- Lỗi -->
            <div id="errorMsg" style="display:none;"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        console.log('User:', user);

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadRentals() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('rentalList');
            const errorDiv = document.getElementById('errorMsg');

            try {
                console.log('Gọi API rentals...');
                const res = await fetch(`http://localhost:5000/api/rentals/user/${user.ma_nguoi_dung}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                console.log('Data từ API:', data);

                loading.style.display = 'none';

                if (data.success) {
                    const rentals = data.rentals || [];
                    console.log('Số hợp đồng:', rentals.length);

                    if (rentals.length === 0) {
                        container.style.display = 'block';
                        container.innerHTML = `
                            <div class="card">
                                <div class="card-header">Chưa có hợp đồng</div>
                                <p style="color:var(--text-muted);text-align:center;padding:20px 0;">
                                    Bạn chưa có hợp đồng thuê nào.
                                    <br><br>
                                    <a href="marketplace.html" class="btn btn-primary">Thuê NFT ngay</a>
                                </p>
                            </div>
                        `;
                        return;
                    }

                    container.style.display = 'block';
                    renderRentals(rentals);
                } else {
                    errorDiv.style.display = 'block';
                    errorDiv.className = 'msg msg-error';
                    errorDiv.textContent = 'Lỗi: ' + (data.message || 'Không thể tải danh sách');
                }
            } catch (error) {
                console.error('Lỗi:', error);
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.className = 'msg msg-error';
                errorDiv.innerHTML = `
                    <p><strong>Lỗi kết nối máy chủ</strong></p>
                    <button onclick="location.reload()" class="btn btn-outline btn-sm" style="margin-top:8px;">Tải lại</button>
                `;
            }
        }

        function renderRentals(rentals) {
            const container = document.getElementById('rentalList');

            let html = `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Vật phẩm</th>
                                <th>Bắt đầu</th>
                                <th>Kết thúc</th>
                                <th>Trạng thái</th>
                                <th>Tiền</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            rentals.forEach((rental, index) => {
                const statusMap = {
                    'dang_thue': 'Đang thuê',
                    'da_tra': 'Đã trả',
                    'da_huy': 'Đã hủy'
                };
                const statusClass = {
                    'dang_thue': 'badge-warning',
                    'da_tra': 'badge-success',
                    'da_huy': 'badge-danger'
                };
                const status = rental.trang_thai_thue || 'dang_thue';
                const tenVatPham = rental.ten_vat_pham || rental.ma_bai_dang?.slice(0, 8) || 'Không rõ';
                const tong = (rental.tong_tien || 0) + (rental.tien_coc || 0);

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${tenVatPham}</strong></td>
                        <td>${new Date(rental.thoi_gian_bat_dau).toLocaleDateString('vi-VN')}</td>
                        <td>${new Date(rental.thoi_gian_ket_thuc).toLocaleDateString('vi-VN')}</td>
                        <td><span class="badge ${statusClass[status] || 'badge'}">${statusMap[status] || status}</span></td>
                        <td>${tong} COINS</td>
                        <td>
                            <a href="rental-detail-view.html?id=${rental.ma_hop_dong}" class="btn btn-outline btn-sm">Chi tiết</a>
                            ${status === 'dang_thue' ? `
                                <button onclick="returnRental('${rental.ma_hop_dong}')" class="btn btn-success btn-sm">Trả</button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        async function returnRental(maHopDong) {
            if (!confirm('Xác nhận trả NFT? Tiền cọc sẽ được hoàn lại.')) return;

            try {
                const res = await fetch(`http://localhost:5000/api/rentals/return/${maHopDong}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    alert('Trả NFT thành công!');
                    loadRentals();
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ');
            }
        }

        loadWalletBalance();
        loadRentals();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
