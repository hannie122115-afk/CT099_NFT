<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân vật</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div id="gameInfo"></div>
            <h2 style="font-size:18px;font-weight:600;margin:14px 0;">Nhân vật</h2>
            <div id="characterList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('game_id');

        if (!gameId) window.location.href = 'games.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadData() {
            try {
                const gamesRes = await fetch('http://localhost:5000/api/games');
                const gamesData = await gamesRes.json();
                if (gamesData.success) {
                    const game = gamesData.games.find(g => g.ma_game === gameId);
                    if (game) {
                        document.getElementById('gameInfo').innerHTML = `
                            <div class="card">
                                <div class="card-header">${game.ten_game}</div>
                                <p style="color:var(--text-secondary);font-size:13px;">${game.mo_ta_game || 'Chưa có mô tả'}</p>
                                <p><strong>Nhà phát hành:</strong> ${game.nha_phat_hanh || 'Không rõ'}</p>
                            </div>
                        `;
                    }
                }

                const res = await fetch(`http://localhost:5000/api/games/${gameId}/characters`);
                const data = await res.json();
                if (data.success) {
                    let html = '<div class="card-grid">';
                    if (data.characters.length === 0) {
                        html += `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:30px 0;">Chưa có nhân vật</p>`;
                    } else {
                        for (const char of data.characters) {
                            html += `
                                <div class="card">
                                    <div class="card-header">${char.ten_nhan_vat}</div>
                                    <div style="margin-top:10px;">
                                        <a href="items.html?character_id=${char.ma_nhan_vat}" class="btn btn-primary btn-sm">Xem vật phẩm</a>
                                    </div>
                                </div>
                            `;
                        }
                    }
                    html += '</div>';
                    document.getElementById('characterList').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('characterList').innerHTML = `<div class="msg msg-error">Lỗi tải danh sách nhân vật</div>`;
            }
        }

        loadWalletBalance();
        loadData();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
