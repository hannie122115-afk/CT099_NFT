<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví của tôi</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html" class="active">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main style="max-width:500px;margin:0 auto;">
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Ví</h2>
            <div id="walletInfo"></div>
            <div id="depositForm"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWallet() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();

                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                    document.getElementById('walletInfo').innerHTML = `
                        <div class="card">
                            <div class="card-header">Thông tin ví</div>
                            <p style="font-size:28px;font-weight:700;color:var(--gold);">${data.wallet.so_du} <span style="font-size:14px;font-weight:400;color:var(--text-muted);">COINS</span></p>
                            <p style="font-size:12px;color:var(--text-muted);font-family:monospace;word-break:break-all;">${data.wallet.dia_chi}</p>
                            <p style="font-size:13px;color:var(--text-secondary);">Chủ sở hữu: ${data.wallet.ten_nguoi_dung}</p>
                        </div>
                    `;

                    document.getElementById('depositForm').innerHTML = `
                        <div class="card">
                            <div class="card-header">Nạp tiền</div>
                            <form id="depositFormSubmit">
                                <div class="form-group">
                                    <label>Số COINS</label>
                                    <input type="number" id="depositAmount" value="100" min="1" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-full">Nạp</button>
                            </form>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('walletInfo').innerHTML = `<div class="msg msg-error">Lỗi tải ví</div>`;
            }
        }

        document.getElementById('depositForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const amount = parseInt(document.getElementById('depositAmount').value) || 0;
            if (amount <= 0) { alert('Số COINS không hợp lệ'); return; }
            if (!confirm(`Nạp ${amount} COINS?`)) return;

            try {
                const res = await fetch('http://localhost:5000/api/wallet/deposit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        ten_nguoi_dung: user.ten_nguoi_dung,
                        so_tien: amount
                    })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Nạp tiền thành công!');
                    loadWallet();
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ');
            }
        });

        loadWallet();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
