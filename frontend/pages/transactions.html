<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao dịch</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html" class="active">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
                <h2 style="font-size:18px;font-weight:600;">Lịch sử giao dịch</h2>
                <div style="display:flex;gap:6px;">
                    <select id="filterType" style="padding:5px 10px;border:1px solid var(--border-color);background:var(--bg-input);color:var(--text-primary);font-size:13px;">
                        <option value="all">Tất cả</option>
                        <option value="thanh_toan_thue">Thuê</option>
                        <option value="hoan_tien_coc">Hoàn cọc</option>
                    </select>
                    <button onclick="loadTransactions()" class="btn btn-outline btn-sm">Làm mới</button>
                </div>
            </div>

            <div id="transactionList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        let allTransactions = [];

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadTransactions() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}/transactions`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    allTransactions = data.transactions || [];
                    renderTransactions(allTransactions);
                } else {
                    document.getElementById('transactionList').innerHTML = `<div class="msg msg-error">Lỗi tải giao dịch</div>`;
                }
            } catch (error) {
                document.getElementById('transactionList').innerHTML = `<div class="msg msg-error">Lỗi kết nối máy chủ</div>`;
            }
        }

        function renderTransactions(transactions) {
            let html = `<div class="table-wrap"><table><thead><tr>
                <th>STT</th><th>Vật phẩm</th><th>Loại</th><th>Số tiền</th><th>Thời gian</th><th>Trạng thái</th>
            </tr></thead><tbody>`;

            if (transactions.length === 0) {
                html += `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:30px 0;">Chưa có giao dịch</td></tr>`;
            } else {
                transactions.forEach((tx, index) => {
                    const typeMap = {
                        'thanh_toan_thue': 'Thanh toán thuê',
                        'hoan_tien_coc': 'Hoàn tiền cọc',
                        'phat': 'Phạt'
                    };
                    const color = tx.loai_giao_dich === 'hoan_tien_coc' ? 'text-success' : 'text-danger';
                    const sign = tx.loai_giao_dich === 'hoan_tien_coc' ? '+' : '-';
                    const statusMap = {
                        'dang_thue': 'Đang thuê',
                        'da_tra': 'Đã trả',
                        'da_huy': 'Đã hủy'
                    };
                    const statusClass = {
                        'dang_thue': 'badge-warning',
                        'da_tra': 'badge-success',
                        'da_huy': 'badge-danger'
                    };

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${tx.ten_vat_pham || 'Không rõ'}</td>
                            <td>${typeMap[tx.loai_giao_dich] || tx.loai_giao_dich}</td>
                            <td class="${color}">${sign} ${tx.so_tien_giao_dich} COINS</td>
                            <td>${new Date(tx.thoi_gian_thanh_toan).toLocaleString('vi-VN')}</td>
                            <td><span class="badge ${statusClass[tx.trang_thai_hop_dong] || 'badge'}">${statusMap[tx.trang_thai_hop_dong] || tx.trang_thai_hop_dong}</span></td>
                        </tr>
                    `;
                });
            }

            html += '</tbody></table></div>';
            document.getElementById('transactionList').innerHTML = html;
        }

        document.getElementById('filterType').addEventListener('change', function() {
            const filter = this.value;
            if (filter === 'all') {
                renderTransactions(allTransactions);
            } else {
                const filtered = allTransactions.filter(tx => tx.loai_giao_dich === filter);
                renderTransactions(filtered);
            }
        });

        loadWalletBalance();
        loadTransactions();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
