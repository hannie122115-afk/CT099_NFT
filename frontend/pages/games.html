<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò chơi</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html" class="active">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Trò chơi</h2>
            <div id="gameList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadGames() {
            try {
                const res = await fetch('http://localhost:5000/api/games');
                const data = await res.json();
                if (data.success) {
                    let html = '<div class="card-grid">';
                    for (const game of data.games) {
                        html += `
                            <div class="card">
                                <div class="card-header">${game.ten_game}</div>
                                <p style="color:var(--text-secondary);font-size:13px;">${game.mo_ta_game || 'Chưa có mô tả'}</p>
                                <p><strong>Nhà phát hành:</strong> ${game.nha_phat_hanh || 'Không rõ'}</p>
                                <p><strong>Số nhân vật:</strong> ${game.so_nhan_vat || 0}</p>
                                <div style="margin-top:10px;">
                                    <a href="characters.html?game_id=${game.ma_game}" class="btn btn-primary btn-sm">Xem nhân vật</a>
                                </div>
                            </div>
                        `;
                    }
                    html += '</div>';
                    document.getElementById('gameList').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('gameList').innerHTML = `<div class="msg msg-error">Lỗi tải danh sách trò chơi</div>`;
            }
        }

        loadWalletBalance();
        loadGames();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
