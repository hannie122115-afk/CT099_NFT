<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết hợp đồng</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 20px;
            padding: 4px 0;
        }
        .info-grid .label {
            color: var(--text-muted);
            font-weight: 600;
        }
        .info-grid .value {
            color: var(--text-primary);
        }
        .section-title {
            font-weight: 700;
            font-size: 14px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 10px;
            margin-top: 12px;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .msg-error {
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px 14px;
            margin-top: 10px;
            background: var(--danger-dim);
        }
        .contract-id {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .price-detail {
            background: var(--bg-input);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin: 6px 0;
        }
        .price-detail .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .price-detail .row.total {
            font-weight: 700;
            font-size: 16px;
            border-top: 2px solid var(--border-color);
            padding-top: 8px;
            margin-top: 4px;
        }
        .price-detail .row .label {
            color: var(--text-secondary);
        }
        .price-detail .row .value {
            font-weight: 600;
        }
        .price-detail .row .value.fee {
            color: var(--text-muted);
            font-size: 13px;
        }
        .price-detail .row .value.total-amount {
            color: var(--gold);
            font-size: 18px;
        }
        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
                gap: 2px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html" class="active">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Chi tiết hợp đồng</h2>
            <a href="rentals.html" class="btn btn-outline btn-sm" style="margin-bottom:12px;">← Quay lại</a>

            <div id="contractDetail"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const contractId = urlParams.get('id');

        if (!contractId) {
            window.location.href = 'rentals.html';
        }

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {
                console.error('Lỗi load wallet:', e);
            }
        }

        async function loadContractDetail() {
            const container = document.getElementById('contractDetail');

            try {
                const res = await fetch(`http://localhost:5000/api/rentals/${contractId}/detail`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await res.json();

                if (data.success) {
                    renderContract(data);
                } else {
                    container.innerHTML = `
                        <div class="msg-error">
                            <strong>Lỗi:</strong> ${data.message || 'Không thể tải chi tiết hợp đồng'}
                            <br><br>
                            <button onclick="window.location.href='rentals.html'" class="btn btn-outline btn-sm">Quay lại</button>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Lỗi:', error);
                container.innerHTML = `
                    <div class="msg-error">
                        <strong>Lỗi kết nối máy chủ</strong>
                        <br><br>
                        <button onclick="location.reload()" class="btn btn-outline btn-sm">Tải lại</button>
                    </div>
                `;
            }
        }

        function renderContract(data) {
            const container = document.getElementById('contractDetail');
            const hd = data.hop_dong;
            const vp = data.vat_pham;
            const nft = data.nft;
            const nguoi_thue = data.nguoi_thue;
            const nhan_vat = data.nhan_vat;

            const statusMap = {
                'dang_thue': 'Đang thuê',
                'da_tra': 'Đã trả',
                'da_huy': 'Đã hủy'
            };
            const statusClass = {
                'dang_thue': 'badge-warning',
                'da_tra': 'badge-success',
                'da_huy': 'badge-danger'
            };

            const isRenter = user.ma_nguoi_dung === hd.ma_nguoi_thue;
            const isActive = hd.trang_thai_thue === 'dang_thue';

            // Lấy tên người thuê
            let tenNguoiThue = 'Không rõ';
            if (nguoi_thue) {
                tenNguoiThue = nguoi_thue.ho_ten || nguoi_thue.ten_nguoi_dung || 'Không rõ';
            }

            // Lấy tên chủ sở hữu
            let tenChuSoHuu = data.ten_chu_so_huu || 'Không rõ';

            // Lấy tên nhân vật
            let tenNhanVat = 'Không chọn';
            if (nhan_vat) {
                tenNhanVat = nhan_vat.ten_nhan_vat || 'Không rõ';
            }

            // Lấy tên vật phẩm
            let tenVatPham = 'Không rõ';
            if (vp) {
                tenVatPham = vp.ten || 'Không rõ';
            }

            // Lấy tên NFT
            let tenNFT = 'Không có';
            if (nft) {
                tenNFT = nft.ten || 'Không có tên';
            }

            // ============================================================
            // 🔥 CHI TIẾT TIỀN - MINH BẠCH 60.5 COINS
            // ============================================================
            const tongTienThue = hd.tong_tien || 0;          // 10 COINS
            const tienCoc = hd.tien_coc || 0;                // 50 COINS
            const phiDichVu = hd.phi_dich_vu || 0;           // 0.5 COINS
            const tongThanhToan = tongTienThue + tienCoc + phiDichVu;  // 60.5 COINS

            // Lấy tỷ lệ phí từ config (nếu có)
            const tyLePhi = data.ty_le_phi || 5;  // Mặc định 5%

            let html = `
                <div class="card">
                    <div class="card-header">
                        Hợp đồng thuê
                        <span class="contract-id">Mã: ${hd.ma_hop_dong}</span>
                    </div>

                    <div class="section-title">Thông tin vật phẩm</div>
                    <div class="info-grid">
                        <span class="label">Tên vật phẩm</span>
                        <span class="value"><strong>${tenVatPham}</strong></span>
                        <span class="label">Mô tả</span>
                        <span class="value">${vp ? vp.mo_ta : 'Không có'}</span>
                        <span class="label">Loại</span>
                        <span class="value">${vp ? vp.loai : 'Không rõ'}</span>
                        <span class="label">Giá thuê</span>
                        <span class="value">${vp ? vp.gia_thue : 0} COINS/ngày</span>
                    </div>

                    <div class="section-title">Thông tin NFT</div>
                    ${nft ? `
                        <div class="info-grid">
                            <span class="label">Tên NFT</span>
                            <span class="value"><strong>${tenNFT}</strong></span>
                            <span class="label">Chủ sở hữu</span>
                            <span class="value">${tenChuSoHuu}</span>
                            <span class="label">Giá thuê</span>
                            <span class="value">${nft.gia_thue} COINS/ngày</span>
                            <span class="label">Trạng thái</span>
                            <span class="value"><span class="badge ${nft.trang_thai === 'co_san' ? 'badge-success' : nft.trang_thai === 'dang_thue' ? 'badge-warning' : 'badge-danger'}">${nft.trang_thai === 'co_san' ? 'Có sẵn' : nft.trang_thai === 'dang_thue' ? 'Đang thuê' : 'Tạm ngưng'}</span></span>
                        </div>
                    ` : `
                        <p style="color:var(--text-muted);">Không có NFT</p>
                    `}

                    <div class="section-title">Thông tin thuê</div>
                    <div class="info-grid">
                        <span class="label">Người thuê</span>
                        <span class="value"><strong>${tenNguoiThue}</strong></span>
                        <span class="label">Nhân vật sử dụng</span>
                        <span class="value">${tenNhanVat}</span>
                        <span class="label">Bắt đầu</span>
                        <span class="value">${new Date(hd.thoi_gian_bat_dau).toLocaleString('vi-VN')}</span>
                        <span class="label">Kết thúc</span>
                        <span class="value">${new Date(hd.thoi_gian_ket_thuc).toLocaleString('vi-VN')}</span>
                        <span class="label">Trạng thái</span>
                        <span class="value"><span class="badge ${statusClass[hd.trang_thai_thue] || 'badge'}">${statusMap[hd.trang_thai_thue] || hd.trang_thai_thue}</span></span>
                    </div>

                    <!-- 🔥 CHI TIẾT TIỀN - MINH BẠCH 60.5 COINS -->
                    <div class="section-title">Chi tiết thanh toán</div>
                    <div class="price-detail">
                        <div class="row">
                            <span class="label">Tiền thuê (${hd.so_ngay_thue || 1} ngày × ${vp ? vp.gia_thue : 0} COINS)</span>
                            <span class="value">${tongTienThue} COINS</span>
                        </div>
                        <div class="row">
                            <span class="label">Tiền cọc (bảo đảm)</span>
                            <span class="value">${tienCoc} COINS</span>
                        </div>
                        ${phiDichVu > 0 ? `
                            <div class="row">
                                <span class="label">Phí dịch vụ (${tyLePhi}%)</span>
                                <span class="value fee">+ ${phiDichVu} COINS</span>
                            </div>
                        ` : ''}
                        <div class="row total">
                            <span class="label">Tổng thanh toán</span>
                            <span class="value total-amount">${tongThanhToan} COINS</span>
                        </div>
                        ${phiDichVu > 0 ? `
                            <div style="font-size:12px;color:var(--text-muted);margin-top:6px;text-align:right;border-top:1px dashed var(--border-color);padding-top:6px;">
                                * Phí dịch vụ ${tyLePhi}% được áp dụng cho tổng tiền thuê
                            </div>
                        ` : ''}
                    </div>

                    <div class="section-title">Lịch sử giao dịch</div>
                    ${data.giao_dich && data.giao_dich.length > 0 ? `
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>Loại</th><th>Số tiền</th><th>Thời gian</th></tr></thead>
                                <tbody>
                                    ${data.giao_dich.map(g => `
                                        <tr>
                                            <td>${g.loai_giao_dich === 'thanh_toan_thue' ? 'Thanh toán thuê + cọc' : g.loai_giao_dich === 'hoan_tien_coc' ? 'Hoàn tiền cọc' : g.loai_giao_dich === 'gia_han' ? 'Gia hạn' : g.loai_giao_dich}</td>
                                            <td><strong>${g.so_tien_giao_dich}</strong> COINS</td>
                                            <td>${new Date(g.thoi_gian_thanh_toan).toLocaleString('vi-VN')}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    ` : `
                        <p style="color:var(--text-muted);">Chưa có giao dịch</p>
                    `}

                    <div class="section-title">Đánh giá</div>
                    ${data.danh_gia ? `
                        <div class="info-grid">
                            <span class="label">Số sao</span>
                            <span class="value">${'★'.repeat(data.danh_gia.so_sao)} (${data.danh_gia.so_sao}/5)</span>
                            <span class="label">Nhận xét</span>
                            <span class="value">${data.danh_gia.noi_dung || 'Không có'}</span>
                        </div>
                    ` : `
                        <p style="color:var(--text-muted);">Chưa có đánh giá</p>
                    `}
            `;

            // Nếu đang thuê và là người thuê -> hiện nút hành động
            if (isActive && isRenter) {
                html += `
                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-color);">
                        <h3 style="font-size:14px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">Thao tác</h3>
                        <div class="action-buttons">
                            <button onclick="returnRental()" class="btn btn-success">Trả NFT</button>
                            <button onclick="cancelRental()" class="btn btn-danger">Hủy hợp đồng</button>
                            <button onclick="extendRental()" class="btn btn-primary">Gia hạn</button>
                            <button onclick="showReportForm()" class="btn btn-outline">Báo cáo</button>
                        </div>
                        <div id="reportForm" style="display:none;margin-top:12px;border:1px solid var(--border-color);padding:16px;">
                            <h4 style="margin-bottom:8px;">Báo cáo vi phạm</h4>
                            <form id="reportFormSubmit">
                                <div class="form-group">
                                    <label>Lý do</label>
                                    <select id="reportReason" required>
                                        <option value="khong_tra_nft">Không trả NFT</option>
                                        <option value="tra_cham">Trả chậm</option>
                                        <option value="nft_bi_hu_hong">NFT bị hư hỏng</option>
                                        <option value="khac">Khác</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Nội dung</label>
                                    <textarea id="reportContent" rows="3" placeholder="Mô tả chi tiết..." required></textarea>
                                </div>
                                <div style="display:flex;gap:8px;">
                                    <button type="submit" class="btn btn-primary">Gửi báo cáo</button>
                                    <button type="button" onclick="hideReportForm()" class="btn btn-outline">Hủy</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }

            // Nếu đã trả và chưa đánh giá -> hiện form đánh giá
            if (hd.trang_thai_thue === 'da_tra' && !data.danh_gia) {
                html += `
                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-color);">
                        <div class="card" style="margin-top:0;">
                            <div class="card-header">Đánh giá hợp đồng</div>
                            <form id="reviewForm">
                                <div class="form-group">
                                    <label>Số sao</label>
                                    <select id="rating" required>
                                        <option value="5">5 sao - Tuyệt vời</option>
                                        <option value="4">4 sao - Tốt</option>
                                        <option value="3">3 sao - Trung bình</option>
                                        <option value="2">2 sao - Kém</option>
                                        <option value="1">1 sao - Rất kém</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Nhận xét</label>
                                    <textarea id="reviewContent" placeholder="Nhập nhận xét..." rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Gửi đánh giá</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;

            // Thêm event listener cho form đánh giá
            const reviewForm = document.getElementById('reviewForm');
            if (reviewForm) {
                reviewForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const so_sao = parseInt(document.getElementById('rating').value);
                    const noi_dung = document.getElementById('reviewContent').value.trim();

                    if (!noi_dung) {
                        alert('Vui lòng nhập nhận xét');
                        return;
                    }

                    try {
                        const res = await fetch(`http://localhost:5000/api/rentals/${contractId}/review`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ so_sao, noi_dung })
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Đánh giá thành công!');
                            loadContractDetail();
                        } else {
                            alert('Lỗi: ' + data.message);
                        }
                    } catch (error) {
                        alert('Lỗi kết nối máy chủ');
                    }
                });
            }

            // Thêm event listener cho form báo cáo
            const reportForm = document.getElementById('reportFormSubmit');
            if (reportForm) {
                reportForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const ly_do = document.getElementById('reportReason').value;
                    const noi_dung = document.getElementById('reportContent').value.trim();

                    if (!noi_dung) {
                        alert('Vui lòng nhập nội dung báo cáo');
                        return;
                    }

                    try {
                        const res = await fetch('http://localhost:5000/api/reports/create', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({
                                ma_hop_dong: contractId,
                                ly_do: ly_do,
                                noi_dung: noi_dung
                            })
                        });
                        const data = await res.json();
                        if (data.success) {
                            alert('Gửi báo cáo thành công!');
                            hideReportForm();
                        } else {
                            alert('Lỗi: ' + data.message);
                        }
                    } catch (error) {
                        alert('Lỗi kết nối máy chủ');
                    }
                });
            }
        }

        // ============================================================
        // HÀNH ĐỘNG
        // ============================================================

        async function returnRental() {
            if (!confirm('Xác nhận trả NFT? Tiền cọc sẽ được hoàn lại.')) return;
            try {
                const res = await fetch(`http://localhost:5000/api/rentals/return/${contractId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert('Trả NFT thành công!');
                    loadContractDetail();
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ');
            }
        }

        async function cancelRental() {
            if (!confirm('Hủy hợp đồng trước hạn? Tiền sẽ được hoàn lại theo số ngày đã dùng.')) return;
            try {
                const res = await fetch(`http://localhost:5000/api/rentals/cancel/${contractId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    loadContractDetail();
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ');
            }
        }

        async function extendRental() {
            const themNgay = prompt('Nhập số ngày muốn gia hạn:');
            if (!themNgay) return;
            const soNgay = parseInt(themNgay);
            if (soNgay <= 0) {
                alert('Số ngày không hợp lệ');
                return;
            }

            try {
                const res = await fetch(`http://localhost:5000/api/rentals/extend/${contractId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ them_ngay: soNgay })
                });
                const data = await res.json();
                if (data.success) {
                    alert(data.message);
                    loadContractDetail();
                } else {
                    alert('Lỗi: ' + data.message);
                }
            } catch (error) {
                alert('Lỗi kết nối máy chủ');
            }
        }

        function showReportForm() {
            document.getElementById('reportForm').style.display = 'block';
        }

        function hideReportForm() {
            document.getElementById('reportForm').style.display = 'none';
            document.getElementById('reportFormSubmit').reset();
        }

        loadWalletBalance();
        loadContractDetail();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
