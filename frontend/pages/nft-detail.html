<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết NFT</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .history-item {
            border-bottom: 1px solid var(--border-color);
            padding: 10px 0;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-item .status {
            font-weight: 600;
        }
        .history-item .status.dang_thue { color: var(--warning); }
        .history-item .status.da_tra { color: var(--success); }
        .history-item .status.da_huy { color: var(--danger); }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html">Tổng quan</a>
            <a href="games.html">Trò chơi</a>
            <a href="marketplace.html">Chợ NFT</a>
            <a href="my-nfts.html">NFT của tôi</a>
            <a href="rentals.html">Thuê</a>
            <a href="wallet.html">Ví</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Chi tiết NFT</h2>

            <div id="nftDetail"></div>

            <div style="margin-top:16px;">
                <h3 style="font-size:16px;font-weight:600;margin-bottom:10px;">Lịch sử thuê</h3>
                <div id="historyList"></div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) window.location.href = 'login.html';

        const urlParams = new URLSearchParams(window.location.search);
        const nftId = urlParams.get('id');

        if (!nftId) window.location.href = 'marketplace.html';

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadWalletBalance() {
            try {
                const res = await fetch(`http://localhost:5000/api/wallet/${user.ten_nguoi_dung}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').textContent = data.wallet.so_du || 0;
                }
            } catch (e) {}
        }

        async function loadNFTDetail() {
            try {
                // Lấy thông tin NFT
                const nftRes = await fetch(`http://localhost:5000/api/nfts/${nftId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const nftData = await nftRes.json();

                if (nftData.success) {
                    const nft = nftData.nft;
                    const statusMap = {
                        'co_san': 'Có sẵn',
                        'dang_thue': 'Đang thuê',
                        'tam_ngung': 'Tạm ngưng'
                    };
                    const statusClass = {
                        'co_san': 'badge-success',
                        'dang_thue': 'badge-warning',
                        'tam_ngung': 'badge-danger'
                    };
                    const ownerName = nft.ten_chu_so_huu || 'Không rõ';

                    document.getElementById('nftDetail').innerHTML = `
                        <div class="card">
                            <div class="card-header">${nft.ten}</div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;">
                                <p><strong>Mô tả:</strong></p>
                                <p>${nft.mo_ta || 'Không có mô tả'}</p>
                                <p><strong>Giá thuê:</strong></p>
                                <p>${nft.gia_thue} COINS/ngày</p>
                                <p><strong>Trạng thái:</strong></p>
                                <p><span class="badge ${statusClass[nft.trang_thai] || 'badge'}">${statusMap[nft.trang_thai] || nft.trang_thai}</span></p>
                                <p><strong>Chủ sở hữu:</strong></p>
                                <p>${ownerName}</p>
                                <p><strong>Lượt thuê:</strong></p>
                                <p>${nft.so_lan_thue || 0}</p>
                                <p><strong>Tổng thu nhập:</strong></p>
                                <p>${nft.tong_thu_nhap || 0} COINS</p>
                            </div>
                            <div style="margin-top:12px;">
                                ${nft.trang_thai === 'co_san' ? `
                                    <a href="rental-detail.html?nft_id=${nft.ma_nft}" class="btn btn-primary">Thuê</a>
                                ` : ''}
                                ${nft.dia_chi_chu_so_huu === user.dia_chi_vi ? `
                                    <a href="my-nfts.html" class="btn btn-outline">Quản lý</a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }

                // Lấy lịch sử thuê
                const historyRes = await fetch(`http://localhost:5000/api/nfts/${nftId}/history`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const historyData = await historyRes.json();

                if (historyData.success) {
                    const history = historyData.history || [];
                    let html = '';
                    if (history.length === 0) {
                        html = '<p style="color:var(--text-muted);">Chưa có lịch sử thuê</p>';
                    } else {
                        html = '<div style="border:1px solid var(--border-color);">';
                        history.forEach(h => {
                            const statusMap = {
                                'dang_thue': 'Đang thuê',
                                'da_tra': 'Đã trả',
                                'da_huy': 'Đã hủy'
                            };
                            html += `
                                <div class="history-item">
                                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                                        <div>
                                            <strong>Người thuê:</strong> ${h.nguoi_thue}
                                        </div>
                                        <div>
                                            <span class="status ${h.trang_thai}">${statusMap[h.trang_thai] || h.trang_thai}</span>
                                        </div>
                                    </div>
                                    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary);">
                                        <span>Bắt đầu: ${new Date(h.thoi_gian_bat_dau).toLocaleDateString('vi-VN')}</span>
                                        <span>Kết thúc: ${new Date(h.thoi_gian_ket_thuc).toLocaleDateString('vi-VN')}</span>
                                        <span>Tiền: ${h.tong_tien || 0} COINS</span>
                                    </div>
                                </div>
                            `;
                        });
                        html += '</div>';
                    }
                    document.getElementById('historyList').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('nftDetail').innerHTML = `<div class="msg msg-error">Lỗi tải chi tiết NFT</div>`;
            }
        }

        loadWalletBalance();
        loadNFTDetail();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
