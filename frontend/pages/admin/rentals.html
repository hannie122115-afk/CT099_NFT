<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý hợp đồng thuê</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quản lý hợp đồng thuê</h1>
            <nav>
                <a href="dashboard.html">Tổng quan</a>
                <a href="users.html">Người dùng</a>
                <a href="games.html">Trò chơi</a>
                <a href="characters.html">Nhân vật</a>
                <a href="items.html">Vật phẩm</a>
                <a href="nfts.html">NFT</a>
                <a href="rentals.html" class="active">Hợp đồng</a>
                <a href="transactions.html">Giao dịch</a>
                <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
            </nav>
        </header>

        <main>
            <div id="rentalList"></div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.vai_tro !== 'quan_tri') {
            window.location.href = '../login.html';
        }

        async function loadRentals() {
            try {
                const res = await fetch('http://localhost:5000/api/admin/rentals', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    let html = `
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>STT</th>
                                        <th>NFT</th>
                                        <th>Người thuê</th>
                                        <th>Chủ sở hữu</th>
                                        <th>Bắt đầu</th>
                                        <th>Kết thúc</th>
                                        <th>Trạng thái</th>
                                        <th>Tiền</th>
                                        <th>Đánh giá</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    if (data.rentals.length === 0) {
                        html += `<tr><td colspan="9" style="text-align:center;color:#718096;">Chưa có hợp đồng thuê nào</td></tr>`;
                    } else {
                        data.rentals.forEach((rental, index) => {
                            const statusMap = {
                                'dang_thue': 'Đang thuê',
                                'da_tra': 'Đã trả',
                                'da_huy': 'Đã hủy'
                            };
                            const statusClass = {
                                'dang_thue': 'badge-warning',
                                'da_tra': 'badge-success',
                                'da_huy': 'badge-danger'
                            };
                            html += `
                                <tr>
                                    <td>${index + 1}</td>
                                    <td style="font-family:monospace;font-size:12px;">${rental.ma_bai_dang.slice(0, 8)}...</td>
                                    <td>${rental.ten_nguoi_thue || rental.ma_nguoi_thue.slice(0, 8)}</td>
                                    <td>${rental.ten_chu_so_huu || 'Không rõ'}</td>
                                    <td>${new Date(rental.thoi_gian_bat_dau).toLocaleDateString('vi-VN')}</td>
                                    <td>${new Date(rental.thoi_gian_ket_thuc).toLocaleDateString('vi-VN')}</td>
                                    <td><span class="badge ${statusClass[rental.trang_thai_thue] || 'badge'}">${statusMap[rental.trang_thai_thue] || rental.trang_thai_thue}</span></td>
                                    <td>${rental.tong_tien || 'N/A'} COINS</td>
                                    <td>${rental.so_sao ? rental.so_sao + ' sao' : 'Chưa đánh giá'}</td>
                                </tr>
                            `;
                        });
                    }

                    html += '</tbody></table></div>';
                    document.getElementById('rentalList').innerHTML = html;
                }
            } catch (error) {
                document.getElementById('rentalList').innerHTML = `
                    <div class="message message-error">Lỗi tải danh sách hợp đồng</div>
                `;
            }
        }

        loadRentals();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        });
    </script>
</body>
</html>
