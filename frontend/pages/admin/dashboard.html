<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Tổng quan</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">NFT <span>RENTAL</span></div>
        <div class="topbar-nav" id="topbarNav">
            <a href="dashboard.html" class="active">Tổng quan</a>
            <a href="users.html">Người dùng</a>
            <a href="games.html">Trò chơi</a>
            <a href="characters.html">Nhân vật</a>
            <a href="items.html">Vật phẩm</a>
            <a href="nfts.html">NFT</a>
            <a href="rentals.html">Hợp đồng</a>
            <a href="transactions.html">Giao dịch</a>
            <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
        </div>
        <div class="topbar-right">
            <div class="balance-box">
                <span class="amount" id="walletBalance">0</span> COINS
            </div>
            <button class="topbar-toggle" onclick="toggleNav()">☰</button>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 style="font-size:18px;font-weight:600;margin-bottom:14px;">Tổng quan hệ thống</h2>

            <div id="statsGrid" class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Người dùng</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalGames">0</div>
                    <div class="label">Trò chơi</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalNFTs">0</div>
                    <div class="label">NFT</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalRentals">0</div>
                    <div class="label">Hợp đồng thuê</div>
                </div>
            </div>

            <div class="admin-nav">
                <a href="users.html">Quản lý người dùng</a>
                <a href="games.html">Quản lý trò chơi</a>
                <a href="characters.html">Quản lý nhân vật</a>
                <a href="items.html">Quản lý vật phẩm</a>
                <a href="nfts.html">Quản lý NFT</a>
                <a href="rentals.html">Quản lý hợp đồng</a>
                <a href="transactions.html">Quản lý giao dịch</a>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.vai_tro !== 'quan_tri') {
            window.location.href = '../login.html';
        }

        function toggleNav() {
            document.getElementById('topbarNav').classList.toggle('open');
        }

        async function loadStats() {
            try {
                const res = await fetch('http://localhost:5000/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users || 0;
                    document.getElementById('totalGames').textContent = data.stats.total_games || 0;
                    document.getElementById('totalNFTs').textContent = data.stats.total_nfts || 0;
                    document.getElementById('totalRentals').textContent = data.stats.total_rentals || 0;
                }
            } catch (error) {
                console.error('Lỗi tải thống kê:', error);
            }
        }

        loadStats();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        });
    </script>
</body>
</html>
