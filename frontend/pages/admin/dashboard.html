<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Tổng quan</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quản trị hệ thống</h1>
            <nav>
                <a href="dashboard.html" class="active">Tổng quan</a>
                <a href="users.html">Người dùng</a>
                <a href="games.html">Trò chơi</a>
                <a href="characters.html">Nhân vật</a>
                <a href="items.html">Vật phẩm</a>
                <a href="nfts.html">NFT</a>
                <a href="rentals.html">Hợp đồng</a>
                <a href="transactions.html">Giao dịch</a>
                <a href="#" class="logout" id="logoutBtn">Đăng xuất</a>
            </nav>
        </header>

        <main>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Người dùng</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalGames">0</div>
                    <div class="label">Trò chơi</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalNFTs">0</div>
                    <div class="label">NFT</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalRentals">0</div>
                    <div class="label">Hợp đồng thuê</div>
                </div>
            </div>

            <div class="admin-nav">
                <a href="users.html">Quản lý người dùng</a>
                <a href="games.html">Quản lý trò chơi</a>
                <a href="characters.html">Quản lý nhân vật</a>
                <a href="items.html">Quản lý vật phẩm</a>
                <a href="nfts.html">Quản lý NFT</a>
                <a href="rentals.html">Quản lý hợp đồng</a>
                <a href="transactions.html">Quản lý giao dịch</a>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user || user.vai_tro !== 'quan_tri') {
            window.location.href = '../login.html';
        }

        async function loadStats() {
            try {
                // Gọi API thống kê
                const res = await fetch('http://localhost:5000/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.stats.total_users || 0;
                    document.getElementById('totalGames').textContent = data.stats.total_games || 0;
                    document.getElementById('totalNFTs').textContent = data.stats.total_nfts || 0;
                    document.getElementById('totalRentals').textContent = data.stats.total_rentals || 0;
                } else {
                    // Fallback: gọi từng API riêng
                    loadStatsFallback();
                }
            } catch (error) {
                console.error('Lỗi tải thống kê:', error);
                loadStatsFallback();
            }
        }

        async function loadStatsFallback() {
            try {
                // Users
                const usersRes = await fetch('http://localhost:5000/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const usersData = await usersRes.json();
                if (usersData.success) {
                    document.getElementById('totalUsers').textContent = usersData.users.length;
                }

                // Games
                const gamesRes = await fetch('http://localhost:5000/api/games');
                const gamesData = await gamesRes.json();
                if (gamesData.success) {
                    document.getElementById('totalGames').textContent = gamesData.games.length;
                }

                // NFTs
                const nftsRes = await fetch('http://localhost:5000/api/nfts', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const nftsData = await nftsRes.json();
                if (nftsData.success) {
                    document.getElementById('totalNFTs').textContent = nftsData.nfts.length;
                }

                // Rentals
                const rentalsRes = await fetch('http://localhost:5000/api/admin/rentals', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const rentalsData = await rentalsRes.json();
                if (rentalsData.success) {
                    document.getElementById('totalRentals').textContent = rentalsData.rentals.length;
                }
            } catch (error) {
                console.error('Lỗi tải thống kê fallback:', error);
            }
        }

        loadStats();

        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '../login.html';
        });
    </script>
</body>
</html>
