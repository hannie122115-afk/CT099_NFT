<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Đăng ký tài khoản</h1>
            <nav>
                <a href="../index.html">Trang chủ</a>
                <a href="login.html">Đăng nhập</a>
            </nav>
        </header>

        <main style="max-width:420px;margin:0 auto;">
            <div style="background:#fff;border:1px solid #e2e8f0;border-radius:4px;padding:32px 36px;">
                <h2 style="font-size:22px;margin-bottom:6px;color:#1a1a2e;">Tạo tài khoản mới</h2>
                <p style="color:#718096;font-size:14px;margin-bottom:24px;">Đăng ký để bắt đầu thuê NFT</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
                    </div>
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Nhập email" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" id="phone" placeholder="Nhập số điện thoại (tùy chọn)">
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" required>
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu</label>
                        <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Đăng ký</button>
                </form>

                <div id="message" class="message" style="display:none;"></div>

                <p style="margin-top:18px;text-align:center;font-size:14px;color:#718096;">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const msg = document.getElementById('message');

            if (!username || !password || !fullname || !email) {
                msg.style.display = 'block';
                msg.className = 'message message-error';
                msg.textContent = 'Vui lòng điền đầy đủ thông tin bắt buộc';
                return;
            }

            if (password.length < 6) {
                msg.style.display = 'block';
                msg.className = 'message message-error';
                msg.textContent = 'Mật khẩu phải có ít nhất 6 ký tự';
                return;
            }

            if (password !== confirm) {
                msg.style.display = 'block';
                msg.className = 'message message-error';
                msg.textContent = 'Mật khẩu xác nhận không khớp';
                return;
            }

            const data = {
                ten_nguoi_dung: username,
                mat_khau: password,
                ho_ten: fullname,
                email: email,
                so_dien_thoai: phone || ''
            };

            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    msg.style.display = 'block';
                    msg.className = 'message message-success';
                    msg.textContent = 'Đăng ký thành công. Đang chuyển đến trang đăng nhập...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    msg.style.display = 'block';
                    msg.className = 'message message-error';
                    msg.textContent = result.message || 'Đăng ký thất bại';
                }
            } catch (error) {
                msg.style.display = 'block';
                msg.className = 'message message-error';
                msg.textContent = 'Lỗi kết nối đến máy chủ';
            }
        });
    </script>
</body>
</html>
